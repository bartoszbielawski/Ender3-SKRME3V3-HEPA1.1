# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[virtual_sdcard]
on_error_gcode: CANCEL_PRINT
path: /home/<user>/printer_data/gcodes

[bltouch]
sensor_pin: PC14
control_pin: PA1
x_offset: -37
y_offset: 2
#z_offset: 1.48
samples: 2
samples_result: average
speed: 5.0
pin_move_time: 1.0

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 190, 210
probe_count: 5, 5
algorithm: bicubic

[bed_screws]
screw1: 33,34
screw1_name: front left
screw2: 202,37
screw2_name: front right
screw3: 202,204
screw3_name: rear right
screw4: 33,203
screw4_name: rear left

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -22
position_min: -22
position_max: 215
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[safe_z_home]
home_xy_position: 115,115 # Change coordinates to the center of your print bed
speed: 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 235

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.895  # calibrated 13.11.2026 (was 8.3989, 100 mm test: 94 -> 100)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250
pressure_advance: 0.11  # 16.11.2026: line test #6 and cube matrix (best cubes at 0.11); the 0.175 from the PA tower was an outlier

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# FAN2 socket: hotend heatsink fan - always full speed when hot (heat creep!)
[heater_fan hotend_fan]
pin: PB15
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# FAN1 socket: electronics/board fan - on while steppers or heaters are active
[controller_fan board_fan]
pin: PC7
fan_speed: 0.6
idle_speed: 0.6
idle_timeout: 30
kick_start_time: 0.5
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z, extruder

[fan]
pin: PC6

# Board (STM32G0B1 internal sensor) and Raspberry Pi temperatures - indirect check of board fan
[temperature_sensor mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1E003A001450415833323520-if00                          

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 5
max_z_accel: 100


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[pause_resume]

[display_status] 

# macros

[gcode_macro CANCEL_PRINT] 
description: Cancel the actual running print 
rename_existing: CANCEL_PRINT_BASE 
variable_park: True 
gcode:    
    TURN_OFF_HEATERS 
    M106 S0 
    CANCEL_PRINT_BASE 

[gcode_macro PAUSE] 
description: Pause the actual running print 
rename_existing: PAUSE_BASE 
gcode:
    PAUSE_BASE   

[gcode_macro RESUME] 
description: Pause the actual running print 
rename_existing: RESUME_BASE 
gcode:
    RESUME_BASE

[gcode_macro PURGE_LINE]
description: Draw a simple purge line at the front left of the bed
gcode:
    G90                         ; Absolute positioning
    G1 Z2.0 F3000               ; Raise Z to avoid hitting bed
    G1 X50 Y50 F5000            ; Move to purge start (just outside mesh)
    G1 Z0.3 F300                ; Lower to purge height
    G92 E0                      ; Reset extruder
    G1 X50 Y180 E10 F1000       ; Draw first purge line (extrude 10mm)
    G1 X55 Y180 F5000           ; Move over slightly
    G1 X55 Y50 E10 F1000        ; Draw second purge line (extrude 10mm)
    G92 E0                      ; Reset extruder
    G1 Z2.0 F3000               ; Raise Z after purge

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    M140 S{BED_TEMP}                  ; start heating the bed
    M104 S150                         ; warm nozzle slightly to soften ooze
    M190 S{BED_TEMP}                  ; wait for bed before probing
    G4 P120000                        ; heat-soak 2 min (remove if not needed)
    G90
    SET_GCODE_OFFSET Z=0.0
    G28
    BED_MESH_PROFILE LOAD="hot60"
    M109 S{EXTRUDER_TEMP}             ; wait for full nozzle temperature
    ; purge line along the front edge: 2 x 200 mm, 24 mm filament each
    SAVE_GCODE_STATE NAME=purge
    G90
    M83                               ; relative E only inside purge
    G1 Z2.0 F3000
    G1 X20 Y5 F5000
    G1 Z0.3 F300
    G1 X220 Y5 E24 F1000              ; pass 1, left -> right
    G1 X220 Y6.5 F5000
    G1 X20 Y6.5 E24 F1000             ; pass 2, right -> left
    G1 X12 F5000                      ; wipe off the end of the line
    G1 Z2.0 F3000
    G92 E0
    RESTORE_GCODE_STATE NAME=purge

[gcode_macro END_PRINT]
gcode:
    M400                              ; finish pending moves
    G91
    G1 E-3 F1800                      ; retract
    G1 Z10 F3000                      ; lift 10 mm
    G90
    G1 X10 Y200 F6000                 ; park the head, bed forward
    M104 S0                           ; hotend off
    M140 S0                           ; bed off
    M106 S0                           ; part fan off
    M84 X Y E                         ; release X, Y and the extruder

[mcu rpip]
serial: /dev/serial/by-id/usb-Klipper_rp2040_C66018688F364921-if00

[mpu9250]
i2c_mcu: rpip
i2c_bus: i2c0a
axes_map: y,-z,-x

[resonance_tester]
accel_chip: mpu9250
probe_points:
    115, 115, 20

[input_shaper]
shaper_freq_x: 68.2
shaper_type_x: 3hump_ei
shaper_freq_y: 43.8
shaper_type_y: mzv

